name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relay tests
        run: npm test
      - name: Bundle check
        run: npx --yes wrangler@3.90.0 deploy --dry-run --outdir dist
